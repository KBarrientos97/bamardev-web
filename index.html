<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10B981" />
    <title>BamarDev — Inventario y Punto de Venta</title>
    <!--
      Papel del ticket: rollo de 80 mm, como la impresora del mostrador.

      Va acá y no en index.css porque `@import "tailwindcss"` envuelve ese
      archivo en un `@layer`, y una `@page` anidada en una capa es inválida:
      el navegador la descarta en silencio.

      `size` lleva DOS medidas, no `80mm auto`: mezclar una longitud con la
      palabra `auto` no es sintaxis válida y Chrome tira la declaración entera
      —se quedaba sólo con el margen y el papel volvía a Carta—. Verificado
      parseando la regla en el navegador: `80mm auto` sale `@page{margin:4mm}`,
      `80mm 297mm` se conserva. El alto es el tope del papel; en un rollo
      continuo el corte lo da el contenido, y un ticket normal no llega ahí.

      Aun así el cajero puede elegir otro papel en el diálogo de Chrome, así
      que el ticket está hecho para verse bien en cualquiera (ver index.css):
      a 80 mm llena el rollo, y en Carta sale angosto arriba a la izquierda.
    -->
    <style>
      @page {
        size: 80mm 297mm;
        margin: 4mm;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
